<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>MyShop - Product Details</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <!-- Header -->
  <header class="header">
    <div class="container" style="display:flex;align-items:center;justify-content:space-between">
      <div class="navbar-brand">
        <a href="index.html" style="color:#fff">MyShop</a>
      </div>
      <nav>
        <a href="cart.html" style="margin-right:14px;color:#fff">
          Cart <span id="cart-badge" class="badge-qty"></span>
        </a>
        <a href="login.html" style="color:#fff">Login</a>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container" style="max-width:800px;margin-top:24px">

    <div id="productDetails">
      <!-- Product details will be inserted by JS -->
    </div>

  </main>

  <!-- Footer -->
  <footer class="footer">MyShop • Student Project</footer>

  <script src="app.js"></script>
  <script>
    // Get ?id= from URL
    const params = new URLSearchParams(window.location.search);
    const id = parseInt(params.get("id"));

    const allProducts = shop.loadProducts();
    const p = allProducts.find(x => x.id === id);

    const box = document.getElementById("productDetails");

    if (!p) {
      box.innerHTML = `<h2>Product not found</h2>`;
    } else {
      box.innerHTML = `
        <div class="card" style="padding:20px">
          <img src="${p.img}" class="product-img" style="width:100%;max-height:350px;object-fit:cover;border-radius:10px">

          <h2 style="margin-top:16px">${p.title}</h2>
          <p class="small-muted">${p.category} • ${shop.fmt(p.price)}</p>

          <p style="margin-top:12px;font-size:1.1rem">${p.desc}</p>

          <button class="btn btn-primary" 
            onclick="shop.addToCart(${p.id}); shop.updateCartBadge(); alert('Added to cart!')">
            Add to Cart
          </button>

          <a href="products.html" class="btn btn-primary" style="margin-left:10px">Back</a>
        </div>
      `;
    }

    shop.updateCartBadge();
  </script>

</body>
</html>
