<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>MyShop - Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <header class="header">
    <div class="container">
      <h2 style="color:white">MyShop</h2>
    </div>
  </header>

  <main class="container" style="max-width:400px;">

    <h2>Login / Register</h2>

    <input id="email" type="email" placeholder="Email" class="input">
    <input id="password" type="password" placeholder="Password" class="input">

    <button id="loginBtn" class="btn-disabled">Login</button>

  </main>

  <footer class="footer">MyShop • Auth Page</footer>

  <script>
    const email = document.getElementById("email");
    const pass = document.getElementById("password");
    const btn = document.getElementById("loginBtn");

    function check() {
      if (email.value.length > 3 && pass.value.length > 3) {
        btn.className = "btn-primary";
      } else {
        btn.className = "btn-disabled";
      }
    }

    email.oninput = check;
    pass.oninput = check;

    btn.onclick = () => {
      if (btn.className === "btn-primary") {
        // Save login session
        localStorage.setItem("user", email.value);

        // Redirect to home page
        location.href = "home.html";
      }
    };
  </script>

  <style>
    .input {
      width:100%;
      padding:10px;
      margin:8px 0;
      border-radius:6px;
      border:1px solid #ccc;
    }
    .btn-disabled {
      width:100%;
      padding:10px;
      background:#d0d7e2;
      color:#666;
      border:none;
      border-radius:6px;
    }
    .btn-primary {
      width:100%;
      padding:10px;
      background:#0d6efd;
      color:white;
      border:none;
      border-radius:6px;
    }
  </style>

</body>
</html>
