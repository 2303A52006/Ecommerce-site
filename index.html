<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>MyShop - Home</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <!-- Header -->
  <header class="header">
    <div class="container header-flex">

      <!-- LOGO -->
      <a href="index.html" class="logo">MyShop</a>

      <!-- NAV LINKS -->
      <nav style="display:flex; gap:20px; align-items:center;">
        <a href="login.html" class="nav-link" style="color:white; font-size:16px;">Login</a>
        <a href="cart.html" class="nav-link" style="color:white; font-size:16px;">
          Cart <span id="cart-badge" class="badge-qty"></span>
        </a>
      </nav>

    </div>
  </header>

  <!-- Main Content -->
  <main class="container">

    <h2 style="margin:20px 0">Our Products</h2>

    <div id="product-list" class="grid"></div>

  </main>

  <!-- Footer -->
  <footer class="footer">MyShop • Student Project</footer>

  <script src="app.js"></script>

  <script>
    const items = shop.loadProducts();

    const list = document.getElementById("product-list");

    list.innerHTML = items.map(p => `
      <div class="card clickable-card" onclick="location.href='product.html?id=${p.id}'">

        <img class="product-img" src="${p.img}" alt="${p.name}">

        <div style="padding:12px">
          <h3>${p.name}</h3>
          <p class="small-muted">${shop.fmt(p.price)}</p>
        </div>

      </div>
    `).join("");

    shop.updateCartBadge();
  </script>

</body>
</html>
